[project]
name = "ge_rbf"
version = "0.2.0"
description = "Gradient-enhanced radial basis function surrogates with isotropic coordinate system transformations"
authors = [
    {name = "Johann Bouwer", email = "68966619+JohannBouwer@users.noreply.github.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["surrogate", "radial basis function", "gradient enhanced", "optimisation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.2.2,<3.0.0",
    "scipy>=1.15.1,<2.0.0",
    "scikit-learn>=1.6,<2.0.0",
    "matplotlib>=3.10.0,<4.0.0",
]

[project.urls]
Repository = "https://github.com/JohannBouwer/GE_RBF"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ge_rbf"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
notebooks = [
    "jupyter>=1.1",
    "nbconvert>=7.16",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures return (X, y, dy) as a set; unpacking all three keeps them readable even
# when a particular test only needs two.
"tests/*" = ["E501", "RUF059"]
# Notebook cells report results with long f-strings that cannot usefully be wrapped.
"notebooks/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
